version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: vitrina_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8082:3000"   # <-- Puerto externo 8082 mapeado al interno 3000
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/vitrina_db?schema=public
      JWT_SECRET: mi_secreto_super_seguro_123
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
