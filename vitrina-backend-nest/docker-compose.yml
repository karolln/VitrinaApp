services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vitrina_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "${APP_PORT:-8082}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/vitrina_db?schema=public
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
